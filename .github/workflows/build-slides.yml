name: Build and publish slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: diapositivas/package-lock.json

      - name: Install dependencies
        working-directory: diapositivas
        run: npm install

      - name: Build HTML slides
        working-directory: diapositivas
        run: npm run build

      - name: Upload generated HTML as artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides-html
          path: diapositivas/dist

      - name: Upload Pages artifact
        if: ${{ vars.ENABLE_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: diapositivas/dist

  deploy-pages:
    if: ${{ vars.ENABLE_PAGES == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4